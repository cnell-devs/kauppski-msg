name: Deploy Terraform

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    uses: ./.github/workflows/bootstrap.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  plan:
    name: Plan ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    runs-on: ubuntu-latest
    needs: bootstrap

    env:
      ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      REGION: us-east-1
      TF_IN_AUTOMATION: true

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build zips
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p terraform/.lambda_zips

          # One layer zip: deps under python/ as required by Lambda layers
          pip install -r lambdas/requirements.txt -t /tmp/layer/python/ --quiet
          (cd /tmp/layer && zip -r ${{ github.workspace }}/terraform/.lambda_zips/layer.zip python/ \
            -x "**/__pycache__/*" -x "**/*.pyc" -x "**/*.dist-info/*" -x "**/*.egg-info/*" -q)

          # One small zip per function: handler + shared only (no deps)
          for fn in connect disconnect send_message get_messages list_conversations mark_read; do
            staging=$(mktemp -d)
            cp -r lambdas/shared "$staging/shared"
            cp -r lambdas/${fn} "$staging/${fn}"
            (cd "$staging" && zip -r ${{ github.workspace }}/terraform/.lambda_zips/${fn}.zip . \
              -x "**/__pycache__/*" -x "**/*.pyc" -q)
            rm -rf "$staging"
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ needs.bootstrap.outputs.bucket }}" \
            -backend-config="key=${{ needs.bootstrap.outputs.state_key }}" \
            -backend-config="region=${{ env.REGION }}" \
            -backend-config="dynamodb_table=${{ needs.bootstrap.outputs.lock_table }}" \
            -backend-config="encrypt=true"

      - name: Terraform plan
        run: |
          terraform plan \
            -var="env=${{ env.ENV }}" \
            -var="supabase_url=${{ secrets.SUPABASE_URL }}" \
            -out=tfplan \
            -no-color

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENV }}
          path: terraform/tfplan
          retention-days: 1

  apply:
    name: Apply ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    runs-on: ubuntu-latest
    needs: [bootstrap, plan]
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    env:
      ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      REGION: us-east-1
      TF_IN_AUTOMATION: true

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build zips
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p terraform/.lambda_zips

          # One layer zip: deps under python/ as required by Lambda layers
          pip install -r lambdas/requirements.txt -t /tmp/layer/python/ --quiet
          (cd /tmp/layer && zip -r ${{ github.workspace }}/terraform/.lambda_zips/layer.zip python/ \
            -x "**/__pycache__/*" -x "**/*.pyc" -x "**/*.dist-info/*" -x "**/*.egg-info/*" -q)

          # One small zip per function: handler + shared only (no deps)
          for fn in connect disconnect send_message get_messages list_conversations mark_read; do
            staging=$(mktemp -d)
            cp -r lambdas/shared "$staging/shared"
            cp -r lambdas/${fn} "$staging/${fn}"
            (cd "$staging" && zip -r ${{ github.workspace }}/terraform/.lambda_zips/${fn}.zip . \
              -x "**/__pycache__/*" -x "**/*.pyc" -q)
            rm -rf "$staging"
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ needs.bootstrap.outputs.bucket }}" \
            -backend-config="key=${{ needs.bootstrap.outputs.state_key }}" \
            -backend-config="region=${{ env.REGION }}" \
            -backend-config="dynamodb_table=${{ needs.bootstrap.outputs.lock_table }}" \
            -backend-config="encrypt=true"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.ENV }}
          path: terraform

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
