name: Bootstrap Terraform State

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    name: Bootstrap ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    env:
      ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Resolve account ID
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Set derived variables
        id: vars
        run: |
          BUCKET="kauppski-terraform-state-${{ steps.account.outputs.id }}"
          echo "bucket=${BUCKET}"         >> "$GITHUB_OUTPUT"
          echo "lock_table=kauppski-terraform-locks" >> "$GITHUB_OUTPUT"
          echo "state_key=${{ env.ENV }}/terraform.tfstate" >> "$GITHUB_OUTPUT"

      - name: Create S3 bucket (if needed)
        run: |
          BUCKET="${{ steps.vars.outputs.bucket }}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket already exists, skipping."
          else
            aws s3api create-bucket --bucket "$BUCKET" --region "${{ env.REGION }}"
            echo "Created bucket: ${BUCKET}"
          fi

      - name: Configure S3 bucket
        run: |
          BUCKET="${{ steps.vars.outputs.bucket }}"
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption \
            --bucket "$BUCKET" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"

      - name: Create DynamoDB lock table (if needed)
        run: |
          TABLE="${{ steps.vars.outputs.lock_table }}"
          if aws dynamodb describe-table --table-name "$TABLE" --region "${{ env.REGION }}" 2>/dev/null; then
            echo "Lock table already exists, skipping."
          else
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${{ env.REGION }}"
            aws dynamodb wait table-exists --table-name "$TABLE" --region "${{ env.REGION }}"
            echo "Created lock table: ${TABLE}"
          fi

      - name: Summary
        run: |
          echo "### Terraform State Bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | ${{ env.ENV }} (branch: ${{ github.ref_name }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Bucket** | ${{ steps.vars.outputs.bucket }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **State key** | ${{ steps.vars.outputs.state_key }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Lock table** | ${{ steps.vars.outputs.lock_table }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "terraform init \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  -backend-config=\"bucket=${{ steps.vars.outputs.bucket }}\" \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  -backend-config=\"key=${{ steps.vars.outputs.state_key }}\" \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  -backend-config=\"region=${{ env.REGION }}\" \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  -backend-config=\"dynamodb_table=${{ steps.vars.outputs.lock_table }}\" \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  -backend-config=\"encrypt=true\" \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  -var=\"env=${{ env.ENV }}\"" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
